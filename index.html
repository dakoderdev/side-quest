<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1838" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Side Quests" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,1,-25..0&icon_names=add,alarm,apparel,auto_awesome,bathtub,bed,bedtime,cake,call,celebration,chair,chat,check,checkroom,child_care,clean_hands,cleaning_services,coffee,cooking,delete,dentistry,directions_bike,directions_run,directions_walk,download,draw,edit,edit_note,egg,favorite,fitness_center,groups,headphones,hiking,home,iron,kitchen,laptop,local_florist,local_grocery_store,local_laundry_service,mail,medication,menu_book,monitor_heart,music_note,palette,pets,photo_camera,piano,pill,pool,potted_plant,receipt_long,recycling,remove,restaurant,rocket_launch,savings,schedule,school,self_improvement,settings,shower,smartphone,sports_esports,sports_gymnastics,star,steps,sunny,upload,vaccines,view_agenda,water_drop,work,yard&display=block"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Side Quests</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <canvas id="bgmap" aria-hidden="true"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="app">
      <aside class="side">
        <div class="logo" aria-label="Side Quests">SIDE<br />QUESTS</div>
        <div class="points" data-points aria-hidden="true"></div>
        <nav class="menu" aria-label="Main">
          <button class="sel" aria-current="page" id="mQuests">
            <span class="ms" aria-hidden="true">menu_book</span>Quests
          </button>
          <button class="sel" id="mNew">
            <span class="ms" aria-hidden="true">add</span>New quest
          </button>
        </nav>
        <div class="side-foot">
          <button class="sel" id="mSet">
            <span class="ms" aria-hidden="true">settings</span>Settings
          </button>
          <button class="iconbtn" id="sDensity" aria-pressed="false" aria-label="Compact view">
            <span class="ms" aria-hidden="true">view_agenda</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="top">
          <span class="clock num" data-clock></span>
          <div class="tabbar">
            <button class="key" data-shift="-1" tabindex="-1" aria-label="Previous tab (Q)">
              Q
            </button>
            <div class="tabs" role="tablist" id="tabs" aria-label="Filter quests">
              <button
                class="t-nav"
                role="tab"
                aria-selected="true"
                aria-controls="panel"
                data-f="all"
              >
                All
              </button>
              <button
                class="t-nav"
                role="tab"
                aria-selected="false"
                aria-controls="panel"
                tabindex="-1"
                data-f="todo"
              >
                To do
              </button>
              <button
                class="t-nav"
                role="tab"
                aria-selected="false"
                aria-controls="panel"
                tabindex="-1"
                data-f="done"
              >
                Done today
              </button>
            </div>
            <button class="key" data-shift="1" tabindex="-1" aria-label="Next tab (E)">E</button>
          </div>
          <div class="points" data-points></div>
          <button class="iconbtn" id="tSet" aria-label="Settings">
            <span class="ms" aria-hidden="true">settings</span>
          </button>
          <button
            class="iconbtn density"
            id="density"
            aria-pressed="false"
            aria-label="Compact view"
          >
            <span class="ms" aria-hidden="true">view_agenda</span>
          </button>
        </header>
        <section class="content" id="panel" role="tabpanel">
          <div class="grid" id="grid"></div>
          <div class="empty" id="empty" hidden></div>
        </section>
      </main>
    </div>

    <div class="legend" aria-hidden="true">
      <span>Complete <i class="key">Hold Space</i></span>
      <span>New quest <i class="key">N</i></span>
      <span>Tabs <i class="key">Q</i><i class="key">E</i></span>
    </div>

    <div class="dock">
      <button class="btn" id="dNew"><span class="ms" aria-hidden="true">add</span>New quest</button>
    </div>

    <div class="overlay" id="overlay">
      <form
        class="sheet"
        id="form"
        autocomplete="off"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheetT"
      >
        <h2 id="sheetT" tabindex="-1">New quest</h2>
        <p class="lede" id="sheetL">Keep it tiny: one step you can do in 1 to 8 minutes.</p>
        <div class="field">
          <label class="lbl" for="fName">Name</label>
          <input id="fName" maxlength="40" placeholder="Put on shoes" enterkeyhint="done" />
        </div>
        <div class="field">
          <span class="lbl" id="iconL">Icon</span>
          <div class="choices icons" id="fIcons" role="group" aria-labelledby="iconL"></div>
        </div>
        <div class="field">
          <span class="lbl" id="paceL">Level up every</span>
          <div class="choices pace" id="fPace" role="group" aria-labelledby="paceL">
            <button type="button" class="sel" data-v="3" aria-pressed="false">
              <b>3 times</b><span>Quick</span>
            </button>
            <button type="button" class="sel" data-v="5" aria-pressed="true">
              <b>5 times</b><span>Steady</span>
            </button>
            <button type="button" class="sel" data-v="10" aria-pressed="false">
              <b>10 times</b><span>Long haul</span>
            </button>
          </div>
        </div>
        <div class="field" id="countF" hidden>
          <span class="lbl" id="countL">Times completed</span>
          <div class="stepper" role="group" aria-labelledby="countL">
            <button type="button" class="iconbtn" data-step="-1" aria-label="One less">
              <span class="ms" aria-hidden="true">remove</span>
            </button>
            <output id="fCount" class="num" aria-live="polite">0</output>
            <button type="button" class="iconbtn" data-step="1" aria-label="One more">
              <span class="ms" aria-hidden="true">add</span>
            </button>
          </div>
          <p class="hint">Fix a miscount here. The level updates to match.</p>
        </div>
        <div class="row">
          <button type="button" class="danger" id="fDelete" hidden>Delete quest</button
          ><button type="button" class="btn quiet" id="cancel">Cancel</button
          ><button class="btn" type="submit" id="fSubmit">Start quest</button>
        </div>
      </form>
    </div>

    <div class="overlay" id="setO">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setT">
        <h2 id="setT" tabindex="-1">Settings</h2>
        <p class="lede">Turn effects down whenever they're too much.</p>
        <div class="field toggles" id="setList">
          <button type="button" class="toggle" role="switch" data-s="sound">
            <span>Sound effects</span><i></i>
          </button>
          <button type="button" class="toggle" role="switch" data-s="click">
            <span>Button clicks</span><i></i>
          </button>
          <button type="button" class="toggle" role="switch" data-s="vibe">
            <span>Vibration</span><i></i>
          </button>
          <button type="button" class="toggle" role="switch" data-s="fx">
            <span>Confetti</span><i></i>
          </button>
          <button type="button" class="toggle" data-s="bg"><span>Background</span><i></i></button>
        </div>
        <div class="field">
          <span class="lbl">Your data</span>
          <div class="databtns">
            <button type="button" class="btn quiet" id="dExport">
              <span class="ms" aria-hidden="true">download</span>Export backup
            </button>
            <button type="button" class="btn quiet" id="dImport">
              <span class="ms" aria-hidden="true">upload</span>Import backup
            </button>
          </div>
          <p class="hint" id="dataNote"></p>
          <input type="file" id="dFile" accept="application/json,.json" hidden />
        </div>
        <div class="row"><button type="button" class="btn" id="setDone">Done</button></div>
      </div>
    </div>

    <div class="snack" id="snack" role="status">
      <p id="snackT"></p>
      <button type="button" id="snackU">Undo</button>
    </div>

    <div class="lvup" id="lvup" aria-live="assertive">
      <div class="band">
        <h2 id="lvN"></h2>
        <p id="lvT"></p>
      </div>
    </div>

    <script src="js/settings.js"></script>
    <script src="js/background.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/app.js"></script>
    <script src="js/data.js"></script>
    <script src="js/effects.js"></script>
  </body>
</html>
